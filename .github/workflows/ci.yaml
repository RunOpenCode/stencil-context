name: Node.js CI

on:
    push:
        branches: [main]
        tags:
            - 'v*'
    pull_request:
        
permissions:
    contents: read        

jobs:
    build:
        runs-on: ubuntu-latest
        
        strategy:
            matrix:
                node-version: [24.x]
        
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  
            - name: Install dependencies
              run: npm ci
              
            - name: Clean dist directory
              run: npm run clean
              
            - name: Run tests
              run: npm run test
              
            - name: Clean dist directory
              run: npm run clean              
              
            - name: Build project
              run: npm run build

    publish:
        name: Publish to npm
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: |
                  npm run clean
                  npm run build

            - name: Publish to npm
              run: npm publish --access public              
