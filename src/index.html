<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Context protocol for Stencil - playground</title>

    <script type="module" src="/build/stencil-context.esm.js"></script>
    <script nomodule src="/build/stencil-context.js"></script>
   
  </head>
  <body>
      <h2>
          Web context example
      </h2>
      
      <provide-example section="Foo">
          <consume-example></consume-example>
      </provide-example>
      
      <div></div>
      
      <button id="flush" type="button">Flush</button>

      <div></div>
      
      <textarea id="textarea" rows="10" cols="50"></textarea>
      
      <h2>
          App example
      </h2>

      <app-example></app-example>
      
      <script type="text/javascript">
          document.querySelector('#flush').addEventListener('click', (e) => {
              document.querySelector('consume-example').getLogger().then((logger) => {
                  document.querySelector('#textarea').value = logger.emitted.join('\n');
              });
          });
      </script>
  </body>
</html>
